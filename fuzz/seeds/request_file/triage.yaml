# One state, three typed questions, one API call.
model: jev-latest
state:
  ticket:
    subject: Payouts failing
    text: Help! My payouts have been failing for 3 days.
questions:
  is_urgent:
    type: noul
    instructions: Does `ticket.text` convey urgency?
    criteria:
      "true": Explicitly time-sensitive
      "false": No urgency expressed
  department:
    type: choice
    instructions: Which team should handle this?
    criteria:
      billing: Payments, invoicing, refunds
      technical: Bugs, outages, integrations
      other: ~
  frustration:
    type: score
    instructions: How frustrated is the customer?
    criteria:
      - Calm
      - Frustrated
      - Very angry

# release-please keeps a release pull request open on main, with the next version (from the
# Conventional Commit titles merged since the last release) and its CHANGELOG.md entry. Merging
# that pull request makes the next run create the tag and a draft GitHub Release; the tag starts
# .github/workflows/release.yml, which builds, verifies and publishes it.
#
# release-please acts as the jev-release-bot GitHub App, with a short-lived token limited to this
# repository, not as GITHUB_TOKEN: the organisation does not let GITHUB_TOKEN open pull requests,
# and a pull request or tag made with GITHUB_TOKEN would trigger no workflow (no CI on the release
# pull request, no release build on the tag).
#
# Configuration: release-please-config.json and .release-please-manifest.json.

name: Release Please

on:
  push:
    branches: [main]

# Runs one at a time, in order, so two merges cannot both try to cut the same release.
concurrency:
  group: release-please
  cancel-in-progress: false

# Everything is done with the App token below.
permissions: {}

jobs:
  release-please:
    name: Release pull request and tag
    runs-on: ubuntu-latest
    # The jev-release-bot credentials live in this environment (main only), not
    # in repository secrets, which any branch's workflow could read (#81).
    environment: release-please
    steps:
      - name: Mint a token for jev-release-bot, limited to this repository
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write # the release branch, the tag and the draft release
          permission-pull-requests: write # the release pull request and its labels
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

# release-please keeps a release pull request open on main, with the next version (from the
# Conventional Commit titles merged since the last release) and its CHANGELOG.md entry. Merging
# that pull request makes the next run create the tag and a draft GitHub Release, and dispatch
# .github/workflows/release.yml on the tag to build, verify and publish it.
#
# The tag and release are created with the default GITHUB_TOKEN, which triggers no other workflow;
# a workflow_dispatch is the exception, so the release is started explicitly. The repository must
# allow GitHub Actions to create pull requests (Settings > Actions > General).
#
# Configuration: release-please-config.json and .release-please-manifest.json.

name: Release Please

on:
  push:
    branches: [main]

# Runs one at a time, in order, so two merges cannot both try to cut the same release.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release pull request and tag
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release branch, the tag and the draft release
      pull-requests: write # the release pull request
      issues: write # the autorelease labels on it
      actions: write # dispatching the release workflow
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Build and publish ${{ steps.release.outputs.tag_name }}
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --ref "$TAG"

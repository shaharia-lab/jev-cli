# Release: builds `jev` for six targets, packs the archives, and publishes them to the GitHub
# Release of a tag. Stages run in order, and each stage only starts when the one before succeeded:
#
#   plan → build (6 targets) → package → publish (sign, draft) → attest → verify → finalize → stable ┬→ crates
#                                     └→ homebrew-check (macOS, Linux) ──────────────────────────────┴→ homebrew
#
# How a run starts, and what it does:
#
# - Pushing a tag `v*` publishes it. Normally release-please pushes it, after the release pull
#   request is merged, together with a draft release (.github/workflows/release-please.yml). It
#   acts through the jev-release-bot GitHub App, because a tag pushed with the default GITHUB_TOKEN
#   would trigger no workflow. A person can push one for a pre-release.
# - `gh workflow run release.yml --ref <tag>` runs a tag again, to resume a release whose run can
#   no longer be re-run.
# - Any other ref (a branch dispatch, or a pull request that changes the release plumbing) is a
#   dry run: every target is built, checked and packed, and nothing is published.
#
# Publishing is idempotent. The release stays a draft, invisible to users and to `jev update`,
# until its downloaded assets pass verification; while it is a draft a re-run replaces its assets
# wholesale, and once it is published they are never changed again. Re-running failed jobs is the
# normal way to recover.
#
# Every asset and SHA256SUMS is signed with minisign in `publish`, the only job that can reach the
# signing key: it runs in the `release` environment, which admits `v*` tags only and waits for the
# owner's approval. `attest` records GitHub build provenance for every asset and every binary.
# `verify` downloads the draft's assets and checks them, their signatures (with the standard
# minisign CLI, against crates/jev-cli/keys/release-primary.pub) and their attestations; nothing
# is published unless it passes. SECURITY.md documents the design, verification by hand and key
# rotation.
#
# Later stages attach after `stable`, so they never run for a pre-release and never point at an
# asset that did not pass verification. `homebrew` writes the formulas to shaharia-lab/homebrew-tap
# and `crates` publishes jev-client and jev-cli to crates.io (CI packages both on every pull
# request). `homebrew-check` runs on every run of a stable version, dry runs included:
# Homebrew itself lints, installs and tests the formula against this run's archives before any
# release depends on it. A pre-release has no formula to check, so it skips the job.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - .github/workflows/release-please.yml
      - scripts/release/**
      - crates/jev-cli/keys/**
      - release-please-config.json
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/jev-cli/build.rs
      - crates/jev-cli/examples/dist-assets.rs

# One run per ref at a time; a release run is never cancelled half way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: scripts/release/plan.sh "$GITHUB_REF" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Native runners only, so every binary is also run on its own platform before it ships.
      # The list must match TARGETS in scripts/release/verify-assets.sh.
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2025
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.plan.outputs.version }}
      BIN: target/${{ matrix.target }}/release/jev${{ contains(matrix.target, 'windows') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No build cache: a release is built from a clean slate.
      - run: rustup toolchain install && rustup target add "$TARGET"
      - name: Install the musl C toolchain (ring compiles C and assembly)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: |
          # `jev version` reports the commit and a build date that is the commit's, not the clock's.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) JEV_BUILD_COMMIT=$(git rev-parse --short=12 HEAD) \
            cargo build --release --locked --target "$TARGET" -p jev-cli --bin jev
      - name: Check size (NFR-SIZE-1, at most 15 MB)
        run: |
          size=$(wc -c < "$BIN" | tr -d ' ')
          echo "$BIN is $size bytes"
          test "$size" -le 15000000
      - name: Check the binary reports this version and target
        run: |
          test "$("$BIN" version --field version)" = "$VERSION"
          test "$("$BIN" version --field target)" = "$TARGET"
      - name: Check the binary is statically linked and runs on Alpine
        if: runner.os == 'Linux'
        run: |
          file "$BIN"
          if readelf --dynamic "$BIN" | grep -q NEEDED; then
            echo "::error::$BIN links shared libraries:"; readelf --dynamic "$BIN" | grep NEEDED; exit 1
          fi
          # ldd exits non-zero for a binary that is not dynamic, which is the point.
          linkage=$(ldd "$BIN" 2>&1 || true)
          echo "ldd: $linkage"
          grep -Eq 'not a dynamic executable|statically linked' <<< "$linkage"
          docker run --rm --volume "$PWD/$(dirname "$BIN"):/dist:ro" \
            alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6 \
            /dist/jev version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: ${{ env.BIN }}
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package
    needs: [plan, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          path: bin
      # Man pages and completions come from the command tree, which is the same on every target,
      # so they are generated once here.
      - run: make dist-assets DIR=target/dist-assets
      - run: scripts/release/install-cargo-cyclonedx.sh
      - name: Pack one archive per target
        run: |
          for dir in bin/bin-*; do
            target=${dir#bin/bin-}
            scripts/release/package.sh "$VERSION" "$target" "$(find "$dir" -type f -name 'jev*')" \
              target/dist-assets dist
          done
      - name: Add the JSON Schemas, the SBOM and SHA256SUMS
        run: |
          cp schemas/*.schema.json dist/
          scripts/release/sbom.sh "$VERSION" dist
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - run: scripts/release/verify-assets.sh dist "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Sign and publish draft release
    needs: [plan, package]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # The owner approves every release here; the environment also only admits `v*` tags. It holds
    # the signing key, which no other job is given (`crates` takes only the crates.io token).
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - run: scripts/release/verify-assets.sh dist "$VERSION"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      # The secrets are given to this step alone. sign.sh never passes them as arguments or prints
      # them; GitHub also masks them in the log.
      - name: Sign every asset and SHA256SUMS
        run: scripts/release/sign.sh dist "$VERSION"
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      # A key that does not match the committed public key fails here, before anything is uploaded.
      - run: scripts/release/verify-assets.sh dist "$VERSION" crates/jev-cli/keys/release-primary.pub
      - run: scripts/release/publish.sh "$TAG" dist

  attest:
    name: Attest build provenance
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # to sign the attestations through Sigstore
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bin-*
          path: bin
      # Every published asset, SHA256SUMS included, and the binary in each archive (the same bytes
      # that package.sh packed), so `gh attestation verify` also works on an installed `jev`.
      - name: List the subjects
        run: |
          (cd dist && sha256sum -- *) > subjects
          for dir in bin/bin-*; do
            binary=$(find "$dir" -type f -name 'jev*')
            echo "$(sha256sum < "$binary" | cut -d' ' -f1)  jev-$VERSION-${dir#bin/bin-}/$(basename "$binary")" >> subjects
          done
          cat subjects
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: subjects

  verify:
    name: Verify published assets
    needs: [plan, publish, attest]
    runs-on: ubuntu-latest
    # Reading a draft release takes write access; this job only reads.
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download every asset of the release
        run: gh release download "$TAG" --dir published
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      - name: Every asset is intact and signed by the committed primary key
        run: scripts/release/verify-assets.sh published "$VERSION" crates/jev-cli/keys/release-primary.pub
      - name: Every asset has a build provenance attestation from this workflow
        run: |
          for asset in SHA256SUMS $(sed -E 's/^[0-9a-f]{64} [ *]//' published/SHA256SUMS); do
            gh attestation verify "published/$asset" --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG" > /dev/null
            echo "$asset: attestation verified"
          done
      - name: The published Linux binary runs on Alpine, reports the release version and is attested
        run: |
          tar -xzf "published/jev-$VERSION-x86_64-unknown-linux-musl.tar.gz" -C published
          reported=$(docker run --rm --volume "$PWD/published/jev-$VERSION-x86_64-unknown-linux-musl:/dist:ro" \
            alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6 \
            /dist/jev version --field version)
          test "$reported" = "$VERSION"
          gh attestation verify "published/jev-$VERSION-x86_64-unknown-linux-musl/jev" --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
            --source-ref "refs/tags/$TAG" > /dev/null

  finalize:
    name: Publish release
    needs: [plan, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - name: Take the release out of draft
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]; then
            echo "::notice::$TAG is already published"
            exit 0
          fi
          latest=true
          [ "$PRERELEASE" = true ] && latest=false
          gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE" --latest="$latest"

  # The gate for every stage that must never run for a pre-release (crates.io, the Homebrew tap).
  # Those jobs declare `needs: stable`: when this job is skipped, so are they.
  stable:
    name: Stable release gate
    needs: [plan, finalize]
    if: needs.plan.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo "$TAG is a stable release"
        env:
          TAG: ${{ needs.plan.outputs.tag }}

  # The formula as Homebrew sees it, on every run of a stable version: `brew style` and `brew audit --strict` on the
  # formulas a release would publish, then both installed from this run's archives (file:// URLs,
  # so no release has to exist), `brew test`, and the layout `jev update` relies on to recognise a
  # managed install: the binary in the keg `Cellar/jev/<version>/bin`, beside INSTALL_RECEIPT.json.
  homebrew-check:
    name: Homebrew formula (${{ matrix.os }})
    needs: [plan, package]
    # The main formula refuses a pre-release version, and `homebrew` never runs for one.
    if: needs.plan.outputs.prerelease == 'false'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_ENV_HINTS: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Put Homebrew on the PATH
        if: runner.os == 'Linux'
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Write the formulas into a local tap
        run: |
          brew tap-new --no-git jev-cli/check
          echo "FORMULAS=$(brew --repository jev-cli/check)/Formula" >> "$GITHUB_ENV"
      - name: brew style and brew audit --strict
        run: |
          scripts/release/homebrew-formula.sh main "$VERSION" dist/SHA256SUMS > "$FORMULAS/jev.rb"
          scripts/release/homebrew-formula.sh pinned "$VERSION" dist/SHA256SUMS > "$FORMULAS/jev@$VERSION.rb"
          cat "$FORMULAS/jev.rb"
          brew style jev-cli/check/jev "jev-cli/check/jev@$VERSION"
          brew audit --strict jev-cli/check/jev "jev-cli/check/jev@$VERSION"
      - name: Install both formulas from this run's archives and run their tests
        run: |
          for kind in main pinned; do
            name=jev
            [ "$kind" = main ] || name="jev@$VERSION"
            scripts/release/homebrew-formula.sh "$kind" "$VERSION" dist/SHA256SUMS "file://$PWD/dist" > "$FORMULAS/$name.rb"
            brew install --formula "jev-cli/check/$name"
            brew test "jev-cli/check/$name"
          done
          prefix=$(brew --prefix)
          test "$("$prefix/bin/jev" version --field version)" = "$VERSION"
          test "$("$(brew --prefix "jev@$VERSION")/bin/jev" version --field version)" = "$VERSION"
          for file in share/man/man1/jev.1 etc/bash_completion.d/jev share/zsh/site-functions/_jev \
            share/fish/vendor_completions.d/jev.fish; do
            test -e "$prefix/$file" || { echo "::error::the formula did not install $file"; exit 1; }
          done
          # Homebrew links bin/jev to the keg with a relative symlink.
          exe=$(cd "$prefix/bin" && cd "$(dirname "$(readlink jev)")" && pwd -P)/jev
          echo "jev is installed at $exe"
          case $exe in
            */Cellar/jev/"$VERSION"/bin/jev) ;;
            *) echo "::error::jev is not in the keg Cellar/jev/$VERSION/bin"; exit 1 ;;
          esac
          test -f "${exe%/bin/jev}/INSTALL_RECEIPT.json"

  # Publishes the formulas to shaharia-lab/homebrew-tap: Formula/jev.rb, the pinned
  # Formula/jev@<version>.rb and the tap README's table, with the checksums of the published and
  # verified release. Stable releases only (`needs: stable`); safe to re-run, see
  # scripts/release/homebrew-publish.sh.
  homebrew:
    name: Update the Homebrew tap
    needs: [plan, stable, homebrew-check]
    runs-on: ubuntu-latest
    # The tap App credentials live in this environment (v* tags only), not in
    # repository secrets, which any branch's workflow could read (#81). No
    # reviewer: this run already stopped for approval in `release`.
    environment: publish
    permissions:
      contents: read
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download every asset of the release
        run: gh release download "$TAG" --dir published
        env:
          GH_TOKEN: ${{ github.token }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      # The formulas take their checksums from this SHA256SUMS, so it is checked again here, on
      # the published release, against the committed key.
      - run: scripts/release/verify-assets.sh published "$VERSION" crates/jev-cli/keys/release-primary.pub
      - name: Generate the formulas
        run: |
          mkdir formulas
          scripts/release/homebrew-formula.sh main "$VERSION" published/SHA256SUMS > formulas/jev.rb
          scripts/release/homebrew-formula.sh pinned "$VERSION" published/SHA256SUMS > "formulas/jev@$VERSION.rb"
          cat formulas/jev.rb
      - name: Mint a token for the tap publisher, limited to the tap's contents
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.HOMEBREW_TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write
      - run: scripts/release/homebrew-publish.sh "$VERSION" formulas
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}

  # Publishes jev-client, then jev-cli, to crates.io, whose `cargo binstall` metadata points at this
  # release's archives. Stable releases only (`needs: stable`), after the assets were verified. The
  # crates.io token is a secret of the `release` environment, so the owner approves this job too.
  # A published crate version is permanent; re-running skips what is already there, see
  # scripts/release/crates-publish.sh.
  crates:
    name: Publish to crates.io
    needs: [plan, verify, stable]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: scripts/release/crates-publish.sh "$VERSION"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

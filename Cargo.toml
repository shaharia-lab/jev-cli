[workspace]
resolver = "3"
members = ["crates/jev-client", "crates/jev-cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
# Minimum supported Rust version. Policy: latest stable minus two releases, bumped only in
# minor releases of jev. CI builds the workspace with exactly this toolchain.
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shaharia-lab/jev-cli"
homepage = "https://github.com/shaharia-lab/jev-cli"
authors = ["Shaharia Lab"]
keywords = ["jev", "typesafe", "cli", "ai"]
categories = ["command-line-utilities"]

# What the release archives ship (NFR-SIZE-1: at most 15 MB per target): one optimised,
# link-time-optimised unit with symbols stripped. `cargo install` builds this profile too.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[workspace.dependencies]
jev-client = { path = "crates/jev-client", version = "0.2.0" }

anstyle = "1.0.14"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
csv = "1.4"
fastrand = "2.5"
flate2 = "1.1.9"
httpdate = "1.0.3"
indexmap = { version = "2.14", features = ["serde"] }
# Release signatures: a small, dependency-free verifier by minisign's author. Verification only; the
# release workflow signs with the minisign CLI.
minisign-verify = "0.2.5"
# TLS is rustls with the `ring` provider and the platform certificate verifier, wired up explicitly
# in `jev-client`. No OpenSSL, no `native-tls`, and no process-global crypto provider.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy"] }
# SHA-256 of downloaded updates. Already in the tree as the rustls crypto provider.
ring = "0.17.14"
rpassword = "7.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
schemars = { version = "1.2", features = ["indexmap2", "preserve_order"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde-saphyr = "1.3"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.20"
tokio = { version = "1.53", default-features = false }
toml_edit = "0.25.15"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi", "registry", "tracing-log"] }
unicode-width = "0.2.2"
url = "2.5.8"
zeroize = { version = "1.9", features = ["derive"] }
# Windows release archives. Reading deflate is all the updater needs.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }

# Test-only.
assert_cmd = "2.2.2"
jsonschema = { version = "0.56", default-features = false }
# Signs fake releases for the updater's tests.
minisign = "0.9.1"
predicates = "3.1.4"
pty-process = "0.5.3"
tracing-log = "0.2"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
# `cargo fuzz` builds with `--cfg fuzzing`, which compiles the entry points the targets in fuzz/ call.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# User input must never panic the CLI: failures map to documented exit codes instead.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
# Leftovers that must not reach main.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Pedantic lints that cost more than they give here.
module_name_repetitions = "allow"
# Transitive duplicates are reported by `cargo deny check bans`, which can be configured per crate.
multiple_crate_versions = "allow"
